<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="format-detection" content="telephone=no">
  <title>Works · Yi-Ting Yang Tang</title>
  <meta name="description" content="3D works archive of Yi-Ting Yang Tang — stylised weapons, props and environments. 3D modeling & texturing artist based in Madrid.">
  <meta name="author" content="Yi-Ting Yang Tang">
  <meta name="theme-color" content="#060608">

  <link rel="icon" href="assets/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">

  <link rel="stylesheet" href="styles/fonts.css">

  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/global.css">
  <link rel="stylesheet" href="styles/nav.css">
  <link rel="stylesheet" href="styles/archive.css">
</head>
<body>
  <div id="root"></div>

  <script src="assets/vendor/react.development.js"></script>
  <script src="assets/vendor/react-dom.development.js"></script>
  <script src="assets/vendor/babel.min.js"></script>

  <script src="assets/vendor/gsap.min.js"></script>
  <script src="assets/vendor/ScrollTrigger.min.js"></script>

  <!-- Shared library — provides Mouse (read by cursor.jsx), LangContext,
       ToastProvider, useViewport and ShaderCanvas (the WebGL ambient field
       behind the contact card). Raw WebGL, no THREE dependency. -->
  <script type="text/babel" src="src/lib.jsx"></script>

  <!-- contact.jsx — reused verbatim for its <ContactForm/> (tilting glass
       card, depth-layered fields, animated success check). Only the form is
       mounted here; its page-level <Contact/> wrapper is not used. -->
  <script type="text/babel" src="src/contact.jsx"></script>

  <!-- Custom cursor. global.css hides the native cursor on fine pointers and
       ships the .cursor-dot/.cursor-ring/.cursor-trail styles, so without this
       script the page would have no visible pointer at all. -->
  <script type="text/babel" src="src/cursor.jsx"></script>

  <script type="text/babel" src="src/archive.jsx"></script>
</body>
</html>
